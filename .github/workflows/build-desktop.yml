name: Build Standalone Desktop Executables

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: CleanMail-Windows.exe
            dist_path: dist/CleanMail-Windows.exe
            package_cmd: cp dist/CleanMail.exe dist/CleanMail-Windows.exe

          - os: macos-latest
            artifact_name: CleanMail-macOS.zip
            dist_path: dist/CleanMail-macOS.zip
            package_cmd: cd dist && cp ../packaging/mac/install.sh . && zip -r CleanMail-macOS.zip CleanMail.app install.sh

          - os: ubuntu-22.04
            artifact_name: CleanMail-Linux-x86_64.tar.gz
            dist_path: dist/CleanMail-Linux-x86_64.tar.gz
            package_cmd: chmod +x packaging/linux/package.sh packaging/linux/install.sh packaging/linux/uninstall.sh && ./packaging/linux/package.sh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements-desktop.txt'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libgirepository1.0-dev libcairo2-dev python3-gi python3-gi-cairo gir1.2-webkit2-4.1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt

      - name: Install platform desktop dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          pip install pyobjc-core pyobjc-framework-WebKit pyobjc-framework-Cocoa

      - name: Install platform desktop dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          pip install pycairo PyGObject

      - name: Build Standalone Executable with PyInstaller
        run: |
          pyinstaller --clean -y cleanmail.spec

      - name: Post-process package
        run: |
          ${{ matrix.package_cmd }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.dist_path }}

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: List downloaded release assets
        run: |
          ls -la release_assets

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: CleanMail ${{ github.ref_name }}
          files: release_assets/*
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') || contains(github.ref, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
